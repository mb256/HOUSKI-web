{% extends 'base.html' %}
{% block title %}Smazat aktivitu – HOUSKi{% endblock %}
{% block content %}
<h1>Smazat aktivitu</h1>
<p>Opravdu chcete smazat aktivitu "{{ activity }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Smazat</button>
    <a href="{% url 'activities:list' %}" class="btn btn-secondary">Zrušit</a>
</form>
{% endblock %}
