[project]
name = "houski-web"
version = "0.1.0"
description = "HOUSKI Climbing Club Website"
authors = [
    {name = "mb256",email = "mb256@seznam.cz"}
]
readme = "README.md"
requires-python = "^3.12"
dependencies = [
    "django (>=5.0,<6.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "python-decouple (>=3.8,<4.0)",
    "whitenoise (>=6.12.0,<7.0.0)",
    "django-summernote (>=0.8.20.0,<0.9.0.0)",
    "bleach (<5)"
]


[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-django (>=4.14.0,<5.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "django-debug-toolbar (>=7.1.1,<8.0.0)"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
